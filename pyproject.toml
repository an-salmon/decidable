[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decidable"
version = "0.1.0"
description = "Exact checks for finite mathematical proof obligations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
search = ["cvxpy>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]
