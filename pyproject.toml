[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decideable"
version = "0.1.0"
description = "Exact checks for finite mathematical proof obligations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12"]

[tool.setuptools.packages.find]
where = ["src"]
